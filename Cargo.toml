[package]
name = "muku-pet"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tiny-skia = "0.11"
font8x8 = "0.3"
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
drm = "0.15"
base64 = "0.22"

[profile.release]
lto = true
codegen-units = 1
strip = true
